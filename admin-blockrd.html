<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin - Blocked Users</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5ff;
  color:#333;
}

.header{
  background:#4f46e5;
  color:white;
  text-align:center;
  padding:24px 15px;
  font-size:30px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 18px 60px;
}

.back{
  display:block;
  text-align:center;
  background:white;
  color:#4f46e5;
  padding:20px;
  border-radius:35px;
  font-size:22px;
  font-weight:bold;
  text-decoration:none;
  margin-bottom:25px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.refresh{
  width:100%;
  border:0;
  background:#4f46e5;
  color:white;
  padding:20px;
  border-radius:40px;
  font-size:22px;
  font-weight:bold;
  margin-bottom:25px;
}

.status{
  background:white;
  padding:18px;
  border-radius:22px;
  text-align:center;
  font-size:20px;
  color:#31965a;
  margin-bottom:20px;
}

.total{
  text-align:center;
  font-size:25px;
  margin:20px 0 25px;
}

.card{
  background:white;
  border-radius:30px;
  padding:25px 20px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
}

.photo{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:6px solid #f0c4d9;
  margin-bottom:15px;
}

.name{
  font-size:32px;
  font-weight:bold;
  margin:8px 0 20px;
}

.info{
  text-align:left;
  font-size:20px;
  line-height:1.8;
  margin:10px 0;
}

.info b{
  font-weight:bold;
}

.blocked{
  display:inline-block;
  background:#ffe0e0;
  color:#d22;
  padding:10px 25px;
  border-radius:30px;
  font-weight:bold;
  margin:15px 0;
}

.btn{
  width:100%;
  border:0;
  padding:18px;
  border-radius:40px;
  font-size:21px;
  font-weight:bold;
  margin-top:12px;
}

.profile{
  background:#dce5ff;
  color:#3730a3;
}

.unblock{
  background:#16a34a;
  color:white;
}

.empty{
  background:white;
  border-radius:30px;
  padding:55px 25px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.empty-icon{
  font-size:80px;
}

.empty-title{
  font-size:34px;
  font-weight:bold;
  margin:20px 0;
}

.empty-text{
  font-size:21px;
  color:#777;
  line-height:1.5;
}

.error{
  background:#ffe5e5;
  color:#c62828;
  padding:20px;
  border-radius:20px;
  font-size:18px;
  text-align:center;
}

@media(max-width:600px){

  .header{
    font-size:27px;
  }

  .name{
    font-size:29px;
  }

  .info{
    font-size:19px;
  }

}

</style>

</head>

<body>

<div class="header">
  🔐 Admin - Blocked Users
</div>

<div class="container">

<a href="admin.html" class="back">
  ← Admin Panel पर वापस जाएँ
</a>

<button class="refresh" onclick="loadBlockedUsers()">
  🔄 Blocked Users Refresh करें
</button>

<div id="status" class="status">
  🔄 Blocked Users load हो रहे हैं...
</div>

<div class="total">
  🚫 Total Blocked Users:
  <b id="totalBlocked">0</b>
</div>

<div id="blockedList"></div>

</div>


<script>

/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  const {
    data:{user},
    error
  } = await supabaseClient.auth.getUser();

  if(error || !user){

    alert("कृपया पहले Login करें।");

    window.location.href="login.html";

    return null;
  }

  const {
    data:adminData,
    error:adminError
  } = await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(adminError || !adminData){

    alert("आप Admin नहीं हैं।");

    window.location.href="users.html";

    return null;
  }

  return user;
}


/* =========================
   LOAD BLOCKED USERS
========================= */

async function loadBlockedUsers(){

  const status =
    document.getElementById("status");

  const list =
    document.getElementById("blockedList");

  const total =
    document.getElementById("totalBlocked");

  status.textContent =
    "🔄 Blocked Users load हो रहे हैं...";

  list.innerHTML="";

  const admin =
    await checkAdmin();

  if(!admin) return;


  /*
     IMPORTANT

     Admin द्वारा block किया गया user:

     blocker_id = Admin ID
     blocked_user_id = User ID
  */

  const {
    data:blocks,
    error:blockError
  } = await supabaseClient
    .from("blocks")
    .select("id, blocker_id, blocked_user_id")
    .eq("blocker_id",admin.id);


  if(blockError){

    console.log(blockError);

    status.innerHTML =
      "❌ Blocked Users load नहीं हुए।";

    list.innerHTML =
      '<div class="error">' +
      blockError.message +
      '</div>';

    total.textContent="0";

    return;
  }


  if(!blocks || blocks.length===0){

    total.textContent="0";

    status.innerHTML =
      "✅ कोई Global Blocked User नहीं है।";

    list.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ✅
        </div>

        <div class="empty-title">
          कोई Blocked User नहीं है
        </div>

        <div class="empty-text">
          अभी किसी User को Admin ने
          Global Block नहीं किया है।
        </div>

      </div>
    `;

    return;
  }


  /*
     Duplicate User IDs हटाएँ
  */

  const userIds =
    [...new Set(
      blocks
      .map(function(item){
        return item.blocked_user_id;
      })
      .filter(Boolean)
    )];


  total.textContent =
    userIds.length;


  /*
     Profiles load
  */

  const {
    data:profiles,
    error:profileError
  } = await supabaseClient
    .from("profiles")
    .select(
      "id,name,photo_url,age,gender,city,profession,bio"
    )
    .in("id",userIds);


  if(profileError){

    status.innerHTML =
      "❌ Profiles load नहीं हुए।";

    list.innerHTML =
      '<div class="error">' +
      profileError.message +
      '</div>';

    return;
  }


  status.innerHTML =
    "🚫 " +
    userIds.length +
    " Global Blocked User मिला।";


  /*
     Cards बनाना
  */

  profiles.forEach(function(profile){

    const card =
      document.createElement("div");

    card.className="card";


    const photo =
      profile.photo_url ||
      "https://via.placeholder.com/150";


    card.innerHTML = `

      <img
        class="photo"
        src="${photo}"
        onerror="this.src='https://via.placeholder.com/150'"
      >

      <div class="name">
        ${escapeHtml(profile.name || "User")}
      </div>

      <div class="blocked">
        🔴 Blocked User
      </div>

      <div class="info">

        🎂 <b>Age:</b>
        ${escapeHtml(
          profile.age != null
          ? profile.age + " वर्ष"
          : "—"
        )}

        <br>

        👤 <b>Gender:</b>
        ${escapeHtml(profile.gender || "—")}

        <br>

        📍 <b>City:</b>
        ${escapeHtml(profile.city || "—")}

        <br>

        💼 <b>Profession:</b>
        ${escapeHtml(profile.profession || "—")}

      </div>

      <button
        class="btn profile"
        onclick="viewProfile('${profile.id}')">

        👤 Profile देखें

      </button>

      <button
        class="btn unblock"
        onclick="unblockUser('${profile.id}')">

        🟢 Unblock User

      </button>

    `;

    list.appendChild(card);

  });

}


/* =========================
   VIEW PROFILE
========================= */

function viewProfile(id){

  window.location.href =
    "view-profile.html?id=" +
    encodeURIComponent(id);

}


/* =========================
   UNBLOCK USER
========================= */

async function unblockUser(userId){

  const ok =
    confirm(
      "क्या आप इस User को Unblock करना चाहते हैं?"
    );

  if(!ok) return;


  const admin =
    await checkAdmin();

  if(!admin) return;


  const {
    error
  } = await supabaseClient
    .from("blocks")
    .delete()
    .eq("blocker_id",admin.id)
    .eq("blocked_user_id",userId);


  if(error){

    alert(
      "❌ Unblock नहीं हुआ:\n" +
      error.message
    );

    return;
  }


  alert(
    "✅ User Unblock हो गया।"
  );


  loadBlockedUsers();

}


/* =========================
   SAFE TEXT
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadBlockedUsers();

  }
);

</script>

</body>
</html>
