<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Create Account - Sahnai Dating</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    font-family:
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff0f5,
            #ffe4ed
        );

    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.register-header{

    background:white;

    height:70px;

    padding:0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);

}


.register-logo{

    font-size:24px;

    font-weight:bold;

    color:#e91e63;

}


.login-small{

    border:none;

    background:#e91e63;

    color:white;

    padding:10px 18px;

    border-radius:25px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

}


/* =========================
   MAIN
========================= */

.register-page{

    min-height:
        calc(100vh - 70px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px 16px;

}


/* =========================
   CARD
========================= */

.register-card{

    width:100%;

    max-width:430px;

    background:white;

    border-radius:28px;

    padding:
        28px 24px 25px;

    box-shadow:
        0 15px 45px
        rgba(233,30,99,0.15);

}


/* =========================
   ICON
========================= */

.register-icon{

    width:78px;

    height:78px;

    margin:
        0 auto 15px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ff4f81,
            #e91e63
        );

    font-size:39px;

    box-shadow:
        0 8px 20px
        rgba(233,30,99,0.25);

}


/* =========================
   TITLE
========================= */

.register-card h1{

    text-align:center;

    margin:
        5px 0 8px;

    font-size:29px;

    color:#222;

}


.register-card h1 span{

    color:#e91e63;

}


.register-subtitle{

    text-align:center;

    color:#777;

    font-size:15px;

    margin:
        0 0 25px;

    line-height:1.5;

}


/* =========================
   FORM
========================= */

.register-form{

    width:100%;

}


.input-group{

    margin-bottom:17px;

}


.input-group label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:bold;

    color:#444;

}


.input-box{

    position:relative;

}


.input-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:
        translateY(-50%);

    font-size:20px;

    z-index:2;

}


.register-form input{

    width:100%;

    height:54px;

    padding:
        0 15px 0 48px;

    border:
        1.5px solid #ddd;

    border-radius:15px;

    background:#fafafa;

    font-size:16px;

    outline:none;

    transition:0.2s;

}


.register-form input:focus{

    border-color:#e91e63;

    background:white;

    box-shadow:
        0 0 0 3px
        rgba(233,30,99,0.10);

}


/* =========================
   CREATE BUTTON
========================= */

.create-account-btn{

    width:100%;

    height:56px;

    margin-top:5px;

    border:none;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            #e91e63,
            #ff4f81
        );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 22px
        rgba(233,30,99,0.25);

}


.create-account-btn:active{

    transform:scale(0.98);

}


/* =========================
   LOGIN
========================= */

.already-account{

    text-align:center;

    margin-top:20px;

    color:#777;

    font-size:14px;

}


.already-account button{

    border:none;

    background:none;

    color:#e91e63;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

}


/* =========================
   BACK HOME
========================= */

.back-home{

    width:100%;

    height:48px;

    margin-top:15px;

    border:
        1.5px solid #e91e63;

    border-radius:25px;

    background:white;

    color:#e91e63;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


/* =========================
   PRIVACY
========================= */

.privacy-text{

    text-align:center;

    margin-top:18px;

    color:#999;

    font-size:11px;

    line-height:1.5;

}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .register-card{

        padding:
            35px 35px 30px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="register-header">

    <div class="register-logo">
        💖 Sahnai Dating
    </div>


    <button
        class="login-small"
        onclick="location.href='login.html'"
    >
        Login
    </button>

</header>



<!-- =========================
     REGISTER PAGE
========================= -->

<main class="register-page">


<div class="register-card">


    <div class="register-icon">
        💕
    </div>


    <h1>
        Create
        <span>Account</span>
    </h1>


    <p class="register-subtitle">

        अपना free Dating Account बनाएँ
        और नए लोगों से जुड़ें।

    </p>



    <!-- =========================
         FORM
    ========================= -->

    <form
        id="registerForm"
        class="register-form"
    >


        <!-- NAME -->

        <div class="input-group">

            <label>
                आपका नाम
            </label>

            <div class="input-box">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    id="name"
                    placeholder="अपना नाम लिखें"
                    required
                >

            </div>

        </div>



        <!-- EMAIL -->

        <div class="input-group">

            <label>
                Email
            </label>

            <div class="input-box">

                <span class="input-icon">
                    📧
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="आपका Email"
                    required
                >

            </div>

        </div>



        <!-- PASSWORD -->

        <div class="input-group">

            <label>
                Password
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="कम से कम 6 characters"
                    minlength="6"
                    required
                >

            </div>

        </div>



        <!-- CREATE ACCOUNT -->

        <button
            type="submit"
            class="create-account-btn"
        >
            💕 Create Account
        </button>

    </form>



    <!-- LOGIN -->

    <div class="already-account">

        पहले से Account है?

        <button
            onclick="location.href='login.html'"
        >
            Login करें
        </button>

    </div>



    <!-- HOME -->

    <button
        class="back-home"
        onclick="location.href='index.html'"
    >
        ← Home Page पर जाएँ
    </button>



    <!-- PRIVACY -->

    <div class="privacy-text">

        🔒 आपकी जानकारी सुरक्षित रखी जाएगी।

        <br>

        Sahnai Dating • Meet • Chat ❤️

    </div>


</div>

</main>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>


</body>

</html>
