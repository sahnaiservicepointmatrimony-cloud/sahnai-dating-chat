<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account - Sahnai Dating</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5f8;
    color:#222;
    padding-bottom:82px;
}

/* HEADER */

.header{
    height:70px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#e91e63;
    font-size:23px;
    font-weight:bold;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.find-btn,
.logout-btn{
    border:none;
    padding:9px 13px;
    border-radius:23px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.find-btn{
    background:#ffe3ed;
    color:#e91e63;
}

.logout-btn{
    background:#f4f4f4;
    color:#e91e63;
}

/* MAIN */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:24px 16px 30px;
}

/* TITLE */

.page-title{
    text-align:center;
    margin-bottom:22px;
}

.page-title h1{
    margin:0;
    font-size:30px;
}

.page-title h1 span{
    color:#e91e63;
}

.page-title p{
    margin:7px 0 0;
    color:#777;
    font-size:14px;
}

/* ACCOUNT CARD */

.account-card{
    background:white;
    border-radius:27px;
    padding:22px 18px;
    box-shadow:0 8px 28px rgba(233,30,99,.12);
    margin-bottom:22px;
}

.section-title{
    font-size:21px;
    font-weight:bold;
    color:#333;
    margin-bottom:18px;
}

/* PROFILE */

.my-profile{
    display:flex;
    align-items:center;
    gap:16px;
}

.my-photo{
    width:95px;
    height:95px;
    border-radius:50%;
    object-fit:cover;
    background:#ffe1eb;
    border:4px solid #ffd7e4;
    flex-shrink:0;
}

.my-info{
    flex:1;
    min-width:0;
}

.my-name{
    font-size:23px;
    font-weight:bold;
    color:#e91e63;
    margin-bottom:7px;
}

.my-details{
    color:#666;
    font-size:14px;
    line-height:1.7;
}

/* BUTTONS */

.profile-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.edit-btn,
.view-btn{
    height:48px;
    border-radius:25px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.edit-btn{
    border:none;
    background:linear-gradient(135deg,#e91e63,#ff4f81);
    color:white;
}

.view-btn{
    border:1.5px solid #e91e63;
    background:white;
    color:#e91e63;
}

/* FRIENDS */

.friends-card{
    background:white;
    border-radius:27px;
    padding:20px 18px;
    box-shadow:0 7px 25px rgba(0,0,0,.07);
}

.friends-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.friends-title{
    font-size:21px;
    font-weight:bold;
}

.match-count{
    background:#ffe0eb;
    color:#e91e63;
    padding:7px 13px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.see-all-btn{
    width:100%;
    height:46px;
    margin-top:10px;
    border:none;
    border-radius:25px;
    background:#fff0f5;
    color:#e91e63;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

/* FRIEND CARD */

.friend-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff8fa;
    border:1px solid #ffe4ed;
    border-radius:18px;
    padding:12px;
    margin-bottom:10px;
}

.friend-photo{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;
    background:#ffe1eb;
    flex-shrink:0;
}

.friend-info{
    flex:1;
    min-width:0;
}

.friend-name{
    font-size:17px;
    font-weight:bold;
    color:#333;
}

.friend-details{
    color:#777;
    font-size:12px;
    line-height:1.5;
    margin-top:3px;
}

.friend-chat{
    border:none;
    background:#e91e63;
    color:white;
    padding:9px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

/* EMPTY */

.empty-box{
    background:#fff8fa;
    border-radius:18px;
    padding:28px 15px;
    text-align:center;
    color:#777;
}

.empty-icon{
    font-size:45px;
}

.empty-box h3{
    margin:8px 0;
    color:#333;
    font-size:18px;
}

.empty-box p{
    margin:0;
    font-size:13px;
    line-height:1.6;
}

.loading{
    text-align:center;
    padding:28px;
    color:#777;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    background:white;
    border-top:1px solid #eee;
    box-shadow:0 -4px 18px rgba(0,0,0,.08);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:999;
}

.nav-item{
    flex:1;
    border:none;
    background:transparent;
    color:#777;
    text-align:center;
    font-size:11px;
    cursor:pointer;
    padding:6px 2px;
}

.nav-icon{
    display:block;
    font-size:24px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#e91e63;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:450px){

    .logo{
        font-size:20px;
    }

    .find-btn,
    .logout-btn{
        padding:8px 9px;
        font-size:11px;
    }

    .my-photo{
        width:82px;
        height:82px;
    }

    .my-name{
        font-size:20px;
    }

    .profile-buttons{
        grid-template-columns:1fr;
    }

    .nav-item{
        font-size:10px;
    }

    .nav-icon{
        font-size:22px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">
        💖 Sahnai Dating
    </div>

    <div class="header-buttons">

        <button
            class="find-btn"
            onclick="goFindPeople()">

            🔎 Find

        </button>

        <button
            class="logout-btn"
            id="logoutButton">

            🚪 Logout

        </button>

    </div>

</header>


<!-- MAIN -->

<main class="container">

    <div class="page-title">

        <h1>
            👤 My <span>Account</span>
        </h1>

        <p>
            आपका Sahnai Dating Account
        </p>

    </div>


    <!-- MY PROFILE -->

    <section class="account-card">

        <div class="section-title">
            💖 My Profile
        </div>

        <div id="myProfile">

            <div class="loading">
                Profile loading...
            </div>

        </div>

    </section>


    <!-- FRIENDS -->

    <section class="friends-card">

        <div class="friends-header">

            <div class="friends-title">
                ❤️ My Friends
            </div>

            <span
                class="match-count"
                id="matchCount">

                0 Friends

            </span>

        </div>


        <div id="friendsList">

            <div class="loading">
                Friends loading...
            </div>

        </div>


        <button
            class="see-all-btn"
            onclick="goFriends()">

            ❤️ सभी Friends देखें

        </button>

    </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <!-- IMPORTANT:
         Logged-in Home = Dashboard
    -->

    <button
        class="nav-item active"
        onclick="goHome()">

        <span class="nav-icon">
            🏠
        </span>

        Home

    </button>


    <button
        class="nav-item"
        onclick="goFindPeople()">

        <span class="nav-icon">
            🔎
        </span>

        Find People

    </button>


    <button
        class="nav-item"
        onclick="goFriends()">

        <span class="nav-icon">
            ❤️
        </span>

        Friends

    </button>


    <button
        class="nav-item"
        onclick="goMessages()">

        <span class="nav-icon">
            💬
        </span>

        Messages

    </button>


    <button
        class="nav-item"
        onclick="goAccount()">

        <span class="nav-icon">
            👤
        </span>

        Account

    </button>

</nav>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

/* =========================
   CURRENT USER
========================= */

let currentUser = null;


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        await loadAccount();

    }
);


/* =========================
   LOAD ACCOUNT
========================= */

async function loadAccount(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if(
            error ||
            !data ||
            !data.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            data.user;


        await loadMyProfile();

        await loadMyFriends();


    }
    catch(error){

        console.error(
            "Account load error:",
            error
        );

    }

}


/* =========================
   MY PROFILE
========================= */

async function loadMyProfile(){

    const box =
        document.getElementById(
            "myProfile"
        );


    const {
        data,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select(
        "id,name,age,gender,city,profession,bio,photo_url"
    )
    .eq(
        "id",
        currentUser.id
    )
    .maybeSingle();


    if(error){

        box.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Profile load नहीं हुई
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

        return;

    }


    if(!data){

        box.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    👤
                </div>

                <h3>
                    Profile अभी नहीं बनी
                </h3>

                <p>
                    अपनी Profile बनाकर Sahnai Dating पर लोगों से मिलना शुरू करें।
                </p>

            </div>

        `;

        return;

    }


    const photo =
        data.photo_url ||
        "https://via.placeholder.com/200?text=Profile";


    box.innerHTML = `

        <div class="my-profile">

            <img
                class="my-photo"
                src="${escapeHtml(photo)}"
                alt="My Profile"
            >

            <div class="my-info">

                <div class="my-name">

                    ${escapeHtml(
                        data.name || "User"
                    )}

                </div>


                <div class="my-details">

                    ${
                        data.age
                        ? "🎂 "+
                          escapeHtml(
                              String(data.age)
                          )+
                          " साल<br>"
                        : ""
                    }

                    ${
                        data.gender
                        ? "👤 "+
                          escapeHtml(
                              data.gender
                          )+
                          "<br>"
                        : ""
                    }

                    ${
                        data.city
                        ? "📍 "+
                          escapeHtml(
                              data.city
                          )+
                          "<br>"
                        : ""
                    }

                    ${
                        data.profession
                        ? "💼 "+
                          escapeHtml(
                              data.profession
                          )
                        : ""
                    }

                </div>

            </div>

        </div>


        <div class="profile-buttons">

            <button
                class="edit-btn"
                onclick="editProfile()">

                ✏️ Edit Profile

            </button>


            <button
                class="view-btn"
                onclick="viewMyProfile()">

                👁️ View Profile

            </button>

        </div>

    `;

}


/* =========================
   FRIENDS
========================= */

async function loadMyFriends(){

    const list =
        document.getElementById(
            "friendsList"
        );

    const count =
        document.getElementById(
            "matchCount"
        );


    const {
        data:matches,
        error
    } =
    await supabaseClient
    .from("matches")
    .select(
        "id,user1_id,user2_id,created_at"
    )
    .or(
        "user1_id.eq."+
        currentUser.id+
        ",user2_id.eq."+
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Friends load नहीं हुए
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

        return;

    }


    const totalFriends =
        matches
        ? matches.length
        : 0;


    count.textContent =
        totalFriends +
        (
            totalFriends === 1
            ? " Friend"
            : " Friends"
        );


    if(
        !matches ||
        matches.length === 0
    ){

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    💕
                </div>

                <h3>
                    अभी कोई Friend नहीं है
                </h3>

                <p>
                    जब आपका किसी user के साथ mutual match होगा,
                    वह यहाँ दिखाई देगा।
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    const previewMatches =
        matches.slice(0,3);


    for(
        const match of previewMatches
    ){

        const friendId =
            match.user1_id === currentUser.id
            ? match.user2_id
            : match.user1_id;


        const {
            data:friend,
            error:friendError
        } =
        await supabaseClient
        .from("profiles")
        .select(
            "id,name,age,city,profession,photo_url"
        )
        .eq(
            "id",
            friendId
        )
        .maybeSingle();


        if(
            friendError ||
            !friend
        ){

            continue;

        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "friend-card";


        const photo =
            friend.photo_url ||
            "https://via.placeholder.com/150?text=User";


        card.innerHTML = `

            <img
                class="friend-photo"
                src="${escapeHtml(photo)}"
                alt="Friend"
            >


            <div class="friend-info">

                <div class="friend-name">

                    ${escapeHtml(
                        friend.name || "User"
                    )}

                </div>


                <div class="friend-details">

                    ${
                        friend.age
                        ? "🎂 "+
                          escapeHtml(
                              String(friend.age)
                          )+
                          " साल"
                        : ""
                    }

                    ${
                        friend.city
                        ? " • 📍 "+
                          escapeHtml(
                              friend.city
                          )
                        : ""
                    }

                    ${
                        friend.profession
                        ? "<br>💼 "+
                          escapeHtml(
                              friend.profession
                          )
                        : ""
                    }

                </div>

            </div>


            <button
                class="friend-chat"
                onclick="openChat(
                    '${escapeJs(
                        friend.name || "User"
                    )}',
                    '${friend.id}'
                )">

                💬 Chat

            </button>

        `;


        list.appendChild(
            card
        );

    }

}


/* =========================
   CHAT
========================= */

function openChat(
    name,
    id
){

    window.location.href =
        "chat.html?user="+
        encodeURIComponent(name)+
        "&id="+
        encodeURIComponent(id);

}


/* =========================
   PROFILE
========================= */

function editProfile(){

    window.location.href =
        "profile.html";

}


function viewMyProfile(){

    window.location.href =
        "profile.html";

}


/* =========================
   NAVIGATION
========================= */

/*
   IMPORTANT:
   Logged-in User का Home
   हमेशा Dashboard रहेगा।
*/

function goHome(){

    window.location.href =
        "dashboard.html";

}


function goFindPeople(){

    window.location.href =
        "users.html";

}


function goFriends(){

    window.location.href =
        "matches.html";

}


function goMessages(){

    window.location.href =
        "messages.html";

}


function goAccount(){

    window.location.href =
        "dashboard.html";

}


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutButton")
.addEventListener(
    "click",
    async function(){

        const ok =
            confirm(
                "क्या आप Logout करना चाहते हैं?"
            );


        if(!ok){

            return;

        }


        const {
            error
        } =
        await supabaseClient
        .auth
        .signOut();


        if(error){

            alert(
                "Logout failed: "+
                error.message
            );

            return;

        }


        localStorage.removeItem(
            "unreadMessages"
        );


        window.location.href =
            "index.html";

    }
);


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"');

}

</script>

</body>

</html>
