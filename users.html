<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Find People - Sahnai Dating</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5f8;
    color:#222;
    padding-bottom:80px;
}

/* HEADER */

.header{
    height:68px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    color:#e91e63;
    font-size:23px;
    font-weight:bold;
}

.account-btn{
    border:none;
    background:#ffe3ed;
    color:#e91e63;
    padding:10px 15px;
    border-radius:25px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.container{
    max-width:850px;
    margin:auto;
    padding:22px 15px 30px;
}

.page-title{
    text-align:center;
}

.page-title h1{
    margin:0;
    font-size:30px;
}

.page-title h1 span{
    color:#e91e63;
}

.page-title p{
    color:#777;
    margin:7px 0 20px;
}

/* SEARCH */

.search-box{
    background:white;
    padding:12px;
    border-radius:22px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    margin-bottom:14px;
}

#searchInput{
    width:100%;
    height:48px;
    border:1.5px solid #ddd;
    border-radius:25px;
    padding:0 18px;
    font-size:16px;
    outline:none;
}

#searchInput:focus{
    border-color:#e91e63;
}

/* FILTERS */

.filters{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.filter-btn{
    flex:1;
    border:1.5px solid #f2bfd0;
    background:white;
    color:#e91e63;
    padding:11px 5px;
    border-radius:25px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.filter-btn.active{
    background:#e91e63;
    color:white;
}

/* REFRESH */

.refresh-btn{
    width:100%;
    border:1.5px solid #f3bfd1;
    background:white;
    color:#e91e63;
    padding:13px;
    border-radius:28px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

.refresh-btn:disabled{
    opacity:.6;
}

/* USER CARD */

.user-card{
    background:white;
    border-radius:24px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 6px 24px rgba(233,30,99,.10);
}

.user-top{
    display:flex;
    gap:15px;
    align-items:center;
}

.user-photo{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #ffe0ea;
    background:#ffe1eb;
    flex-shrink:0;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:23px;
    font-weight:bold;
    color:#333;
    margin-bottom:5px;
}

.user-details{
    color:#666;
    line-height:1.55;
    font-size:14px;
}

/* STATUS */

.status{
    margin-top:6px;
    font-size:13px;
    font-weight:bold;
}

.status.online{
    color:#16a34a;
}

.status.offline{
    color:#777;
}

.online-dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    margin-right:4px;
    background:#888;
}

.online-dot.green{
    background:#20d66b;
    box-shadow:0 0 7px rgba(32,214,107,.7);
}

/* BIO */

.user-bio{
    background:#fff7fa;
    border-radius:15px;
    padding:11px 13px;
    margin-top:15px;
    color:#666;
    font-size:14px;
    line-height:1.5;
}

/* MATCH */

.match-badge{
    background:#dcfce7;
    color:#15803d;
    border-radius:20px;
    padding:7px 12px;
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    font-weight:bold;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:15px;
}

.like-btn,
.chat-btn,
.profile-btn,
.block-btn{
    border:none;
    padding:12px 7px;
    border-radius:25px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.like-btn{
    background:#e91e63;
    color:white;
}

.like-btn.liked{
    background:#16a34a;
}

.chat-btn{
    background:#5146e5;
    color:white;
}

.profile-btn{
    background:#ffe3ed;
    color:#e91e63;
}

.block-btn{
    background:#f3f3f3;
    color:#dc2626;
    grid-column:1 / 3;
}

/* EMPTY */

.empty-box{
    background:white;
    border-radius:24px;
    padding:45px 20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.empty-icon{
    font-size:55px;
}

.empty-box h2{
    color:#333;
}

.empty-box p{
    color:#777;
    line-height:1.6;
}

/* LOADING */

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    background:white;
    border-top:1px solid #eee;
    box-shadow:0 -4px 18px rgba(0,0,0,.08);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.nav-item{
    flex:1;
    border:none;
    background:transparent;
    color:#777;
    text-align:center;
    font-size:10px;
    cursor:pointer;
}

.nav-icon{
    display:block;
    font-size:22px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#e91e63;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:20px;
    }

    .user-photo{
        width:82px;
        height:82px;
    }

    .user-name{
        font-size:20px;
    }

    .user-top{
        gap:12px;
    }

    .buttons{
        grid-template-columns:1fr 1fr;
    }

}
</style>

</head>

<body>

<header class="header">

    <div class="logo">
        💖 Sahnai Dating
    </div>

    <button
        class="account-btn"
        onclick="goAccount()">

        👤 Account

    </button>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            🔎 Find <span>People</span>
        </h1>

        <p>
            नए लोगों से मिलें और Connect करें ❤️
        </p>

    </div>


    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="🔎 Name, City या Profession खोजें..."
        >

    </div>


    <div class="filters">

        <button
            class="filter-btn active"
            data-gender="all"
            onclick="setGender('all')">

            👥 All

        </button>

        <button
            class="filter-btn"
            data-gender="Female"
            onclick="setGender('Female')">

            👩 Female

        </button>

        <button
            class="filter-btn"
            data-gender="Male"
            onclick="setGender('Male')">

            👨 Male

        </button>

    </div>


    <button
        id="refreshButton"
        class="refresh-btn">

        🔄 Profiles Refresh करें

    </button>


    <div id="usersList">

        <div class="loading">
            💕 Profiles load हो रहे हैं...
        </div>

    </div>

</main>


<nav class="bottom-nav">

    <button
        class="nav-item"
        onclick="goHome()">

        <span class="nav-icon">🏠</span>
        Home

    </button>


    <button
        class="nav-item active">

        <span class="nav-icon">🔎</span>
        Find People

    </button>


    <button
        class="nav-item"
        onclick="goFriends()">

        <span class="nav-icon">❤️</span>
        Friends

    </button>


    <button
        class="nav-item"
        onclick="goMessages()">

        <span class="nav-icon">💬</span>
        Messages

    </button>


    <button
        class="nav-item"
        onclick="goAccount()">

        <span class="nav-icon">👤</span>
        Account

    </button>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>


<script>

let currentUser = null;
let allUsers = [];
let blockedUsers = new Set();
let currentGender = "all";


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getUser();

        if(
            error ||
            !data ||
            !data.user
        ){

            window.location.href="login.html";
            return;

        }

        currentUser=data.user;

        await loadBlockedUsers();
        await loadUsers();

        document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            filterUsers
        );

        document
        .getElementById("refreshButton")
        .addEventListener(
            "click",
            async function(){

                this.disabled=true;
                this.textContent="⏳ Loading...";

                await loadBlockedUsers();
                await loadUsers();

                this.disabled=false;
                this.textContent="🔄 Profiles Refresh करें";

            }
        );

    }
);


/* =========================
   BLOCKED USERS
========================= */

async function loadBlockedUsers(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("blocks")
    .select("blocked_user_id")
    .eq(
        "blocker_id",
        currentUser.id
    );

    if(error){

        console.log(
            "Block load error:",
            error.message
        );

        blockedUsers=new Set();

        return;

    }

    blockedUsers=new Set(
        (data || []).map(
            item=>item.blocked_user_id
        )
    );

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    const list=
        document.getElementById(
            "usersList"
        );

    list.innerHTML=`
        <div class="loading">
            💕 Profiles load हो रहे हैं...
        </div>
    `;

    const {
        data,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select(
        "id,name,photo_url,age,gender,city,profession,bio,created_at"
    )
    .neq(
        "id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );

    if(error){

        list.innerHTML=`
            <div class="empty-box">

                <div class="empty-icon">⚠️</div>

                <h2>
                    Profiles load नहीं हुए
                </h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>
        `;

        return;

    }

    allUsers=
        (data || []).filter(
            user =>
            !blockedUsers.has(user.id)
        );

    filterUsers();

}


/* =========================
   GENDER FILTER
========================= */

function setGender(gender){

    currentGender=gender;

    document
    .querySelectorAll(".filter-btn")
    .forEach(
        button=>{

            button.classList.remove("active");

            if(
                button.dataset.gender===gender
            ){

                button.classList.add("active");

            }

        }
    );

    filterUsers();

}


/* =========================
   SEARCH
========================= */

function filterUsers(){

    const search=
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const users=
        allUsers.filter(
            user=>{

                const genderMatch=
                    currentGender==="all" ||
                    String(
                        user.gender || ""
                    ).toLowerCase()===
                    currentGender.toLowerCase();

                const text=
                    (
                        (user.name || "")+
                        " "+
                        (user.city || "")+
                        " "+
                        (user.profession || "")
                    ).toLowerCase();

                const searchMatch=
                    !search ||
                    text.includes(search);

                return(
                    genderMatch &&
                    searchMatch
                );

            }
        );

    renderUsers(users);

}


/* =========================
   RENDER USERS
========================= */

async function renderUsers(users){

    const list=
        document.getElementById(
            "usersList"
        );

    if(
        !users ||
        users.length===0
    ){

        list.innerHTML=`
            <div class="empty-box">

                <div class="empty-icon">
                    💕
                </div>

                <h2>
                    कोई Profile नहीं मिली
                </h2>

                <p>
                    Search या filter बदलकर
                    फिर कोशिश करें।
                </p>

            </div>
        `;

        return;

    }

    list.innerHTML="";

    for(
        const user of users
    ){

        await createUserCard(
            user,
            list
        );

    }

}


/* =========================
   USER CARD
========================= */

async function createUserCard(
    user,
    list
){

    const card=
        document.createElement("div");

    card.className="user-card";

    const photo=
        user.photo_url ||
        "https://via.placeholder.com/200?text=User";

    const liked=
        await checkLike(user.id);

    const mutual=
        await checkMutualMatch(user.id);

    card.innerHTML=`

        <div class="user-top">

            <img
                class="user-photo"
                src="${escapeHtml(photo)}"
                alt="Profile"
            >

            <div class="user-info">

                <div class="user-name">
                    ${escapeHtml(
                        user.name || "User"
                    )}
                </div>

                <div class="user-details">

                    ${
                        user.age
                        ? "🎂 "+
                          escapeHtml(user.age)+
                          " साल"
                        : ""
                    }

                    ${
                        user.gender
                        ? " • "+
                          escapeHtml(user.gender)
                        : ""
                    }

                    ${
                        user.city
                        ? "<br>📍 "+
                          escapeHtml(user.city)
                        : ""
                    }

                    ${
                        user.profession
                        ? "<br>💼 "+
                          escapeHtml(user.profession)
                        : ""
                    }

                </div>

            </div>

        </div>

        ${
            mutual
            ? `
                <div class="match-badge">
                    💚 You Both Like Each Other
                </div>
              `
            : ""
        }

        ${
            user.bio
            ? `
                <div class="user-bio">
                    📝 ${escapeHtml(user.bio)}
                </div>
              `
            : ""
        }

        <div class="buttons">

            <button
                class="like-btn ${
                    liked ? "liked" : ""
                }"
                onclick="toggleLike(
                    '${user.id}',
                    this
                )">

                ${
                    liked
                    ? "💚 Liked"
                    : "❤️ Like"
                }

            </button>


            <button
                class="chat-btn"
                onclick="openChat(
                    '${escapeJs(
                        user.name || "User"
                    )}',
                    '${user.id}'
                )">

                💬 Chat

            </button>


            <button
                class="profile-btn"
                onclick="viewProfile(
                    '${user.id}'
                )">

                👤 Profile देखें

            </button>


            <button
                class="block-btn"
                onclick="blockUser(
                    '${user.id}',
                    '${escapeJs(
                        user.name || "User"
                    )}'
                )">

                🚫 Block

            </button>

        </div>

    `;

    list.appendChild(card);

}


/* =========================
   CHECK LIKE
========================= */

async function checkLike(userId){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("likes")
    .select("id")
    .eq(
        "liker_id",
        currentUser.id
    )
    .eq(
        "liked_id",
        userId
    )
    .maybeSingle();

    if(error){
        return false;
    }

    return !!data;

}


/* =========================
   CHECK MATCH
========================= */

async function checkMutualMatch(userId){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("matches")
    .select("id")
    .or(
        "and(user1_id.eq."+currentUser.id+
        ",user2_id.eq."+userId+"),"+
        "and(user1_id.eq."+userId+
        ",user2_id.eq."+currentUser.id+")"
    )
    .maybeSingle();

    if(error){
        return false;
    }

    return !!data;

}


/* =========================
   LIKE / UNLIKE
========================= */

async function toggleLike(
    userId,
    button
){

    button.disabled=true;

    const {
        data:existing,
        error:checkError
    } =
    await supabaseClient
    .from("likes")
    .select("id")
    .eq(
        "liker_id",
        currentUser.id
    )
    .eq(
        "liked_id",
        userId
    )
    .maybeSingle();

    if(checkError){

        alert(
            "Like check में समस्या: "+
            checkError.message
        );

        button.disabled=false;
        return;

    }


    if(existing){

        const {
            error
        } =
        await supabaseClient
        .from("likes")
        .delete()
        .eq(
            "id",
            existing.id
        );

        if(error){

            alert(
                "Unlike करने में समस्या: "+
                error.message
            );

            button.disabled=false;
            return;

        }

        button.classList.remove("liked");
        button.textContent="❤️ Like";
        button.disabled=false;

        return;

    }


    const {
        error:likeError
    } =
    await supabaseClient
    .from("likes")
    .insert({
        liker_id:currentUser.id,
        liked_id:userId
    });

    if(likeError){

        alert(
            "Like करने में समस्या: "+
            likeError.message
        );

        button.disabled=false;
        return;

    }

    button.classList.add("liked");
    button.textContent="💚 Liked";

    /* Check reverse like */

    const {
        data:reverseLike
    } =
    await supabaseClient
    .from("likes")
    .select("id")
    .eq(
        "liker_id",
        userId
    )
    .eq(
        "liked_id",
        currentUser.id
    )
    .maybeSingle();

    if(reverseLike){

        const ids=[
            currentUser.id,
            userId
        ].sort();

        const {
            data:existingMatch
        } =
        await supabaseClient
        .from("matches")
        .select("id")
        .or(
            "and(user1_id.eq."+ids[0]+
            ",user2_id.eq."+ids[1]+"),"+
            "and(user1_id.eq."+ids[1]+
            ",user2_id.eq."+ids[0]+")"
        )
        .maybeSingle();

        if(!existingMatch){

            const {
                error:matchError
            } =
            await supabaseClient
            .from("matches")
            .insert({
                user1_id:ids[0],
                user2_id:ids[1]
            });

            if(matchError){

                console.log(
                    "Match error:",
                    matchError.message
                );

            }else{

                alert(
                    "💕 It's a Match! अब आप दोनों Friends हैं।"
                );

            }

        }

    }

    button.disabled=false;

}


/* =========================
   CHAT
========================= */

function openChat(name,id){

    window.location.href=
        "chat.html?user="+
        encodeURIComponent(name)+
        "&id="+
        encodeURIComponent(id);

}


/* =========================
   PROFILE
========================= */

function viewProfile(id){

    window.location.href=
        "view-profile.html?id="+
        encodeURIComponent(id);

}


/* =========================
   BLOCK
========================= */

async function blockUser(
    userId,
    name
){

    const confirmBlock=
        confirm(
            "क्या आप "+name+
            " को Block करना चाहते हैं?"
        );

    if(!confirmBlock){
        return;
    }

    const {
        error
    } =
    await supabaseClient
    .from("blocks")
    .insert({
        blocker_id:currentUser.id,
        blocked_user_id:userId
    });

    if(error){

        if(error.code==="23505"){

            alert(
                "यह User पहले से Block है।"
            );

        }else{

            alert(
                "Block करने में समस्या: "+
                error.message
            );

        }

        return;

    }

    blockedUsers.add(userId);

    allUsers=
        allUsers.filter(
            user=>user.id!==userId
        );

    filterUsers();

    alert(
        name+
        " को Block कर दिया गया है।"
    );

}


/* =========================
   NAVIGATION
========================= */

function goHome(){

    window.location.href="index.html";

}


function goFriends(){

    window.location.href="matches.html";

}


function goMessages(){

    window.location.href="messages.html";

}


function goAccount(){

    window.location.href="dashboard.html";

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"');

}

</script>

</body>
  </html>
